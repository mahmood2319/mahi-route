
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسیریابی مرسولات ـ نشر ماهی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: #f3f5f7;
    color: #263238;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    max-width: 460px;
    margin: 30px auto;
    background: #fff;
    border-radius: 18px;
    padding: 28px 22px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
    text-align: center;
}

.logo {
    width: 85px;
    height: 85px;
    object-fit: contain;
    margin-bottom: 10px;
}

h1 {
    font-size: 21px;
    color: #963e29;
    margin: 8px 0;
}

.subtitle {
    color: #777;
    font-size: 13px;
    line-height: 2;
    margin-bottom: 24px;
}

.nav-btn {
    display: block;
    width: 100%;
    padding: 16px 12px;
    margin: 13px 0;
    border-radius: 11px;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
}

.btn-neshan {
    background: #159b65;
}

.btn-balad {
    background: #2878c8;
}

.btn-google {
    background: #555d69;
}

.nav-btn:active {
    opacity: .8;
}

.coordinates {
    margin-top: 24px;
    padding: 13px;
    background: #f7f2ed;
    border-radius: 9px;
    font-size: 12px;
    direction: ltr;
    line-height: 2;
    word-break: break-all;
}

.error {
    display: none;
    padding: 16px;
    background: #fff0ed;
    color: #b42318;
    border-radius: 10px;
    line-height: 2;
    font-size: 14px;
}

.footer {
    margin-top: 25px;
    color: #999;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

    <div id="mainContent">

        <h1>مسیریابی مرسولات</h1>

        <div class="subtitle">
            مقصد مرسوله آماده است.<br>
            برنامه مسیریابی موردنظر را انتخاب کنید.
        </div>

        <div id="actionLinks">

            <a id="neshanBtn"
               class="nav-btn btn-neshan"
               target="_blank"
               rel="noopener noreferrer">
                مسیریابی با نشان
            </a>

            <a id="baladBtn"
               class="nav-btn btn-balad"
               target="_blank"
               rel="noopener noreferrer">
                مسیریابی با بلد
            </a>

            <a id="googleBtn"
               class="nav-btn btn-google"
               target="_blank"
               rel="noopener noreferrer">
                مسیریابی با گوگل‌مپ
            </a>

        </div>

        <div class="coordinates">
            <div>مختصات مقصد:</div>
            <strong id="coordsDisplay">در حال بررسی...</strong>
        </div>

        <div id="errorState" class="error">
            مختصات مقصد در لینک QR پیدا نشد یا معتبر نیست.
            لطفاً با دفتر نشر ماهی تماس بگیرید.
        </div>

    </div>

    <div class="footer">
        انتشارات ماهی
    </div>

</div>

<script>
(function () {

    // مختصات ثابت دفتر نشر ماهی
    var ORIGIN_LAT = 35.70129294788876;
    var ORIGIN_LNG = 51.398984197047696;

    function normalizeDigits(value) {
        return String(value || '')
            .replace(/[۰-۹]/g, function (digit) {
                return '۰۱۲۳۴۵۶۷۸۹'.indexOf(digit);
            })
            .replace(/[٠-٩]/g, function (digit) {
                return '٠١٢٣٤٥٦٧٨٩'.indexOf(digit);
            })
            .trim();
    }

    function isValidCoordinate(lat, lng) {
        return isFinite(lat) &&
            isFinite(lng) &&
            lat >= -90 &&
            lat <= 90 &&
            lng >= -180 &&
            lng <= 180 &&
            !(lat === 0 && lng === 0);
    }

    function extractDestination() {

        var params = new URLSearchParams(window.location.search);

        var rawLat =
            params.get('lat') ||
            params.get('latitude') ||
            params.get('dest_lat') ||
            params.get('destination_lat');

        var rawLng =
            params.get('lng') ||
            params.get('lon') ||
            params.get('longitude') ||
            params.get('dest_lng') ||
            params.get('destination_lng');

        if (!rawLat || !rawLng) {
            return null;
        }

        var lat = Number(
            normalizeDigits(rawLat).replace(/,/g, '.')
        );

        var lng = Number(
            normalizeDigits(rawLng).replace(/,/g, '.')
        );

        if (!isValidCoordinate(lat, lng)) {
            return null;
        }

        return {
            lat: lat,
            lng: lng
        };
    }

    var destination = extractDestination();

    var errorState = document.getElementById('errorState');
    var actionLinks = document.getElementById('actionLinks');
    var coordsDisplay = document.getElementById('coordsDisplay');

    if (!destination) {
        errorState.style.display = 'block';
        actionLinks.style.display = 'none';
        coordsDisplay.textContent = 'مختصات نامعتبر است';
        return;
    }

    var origin =
        ORIGIN_LAT.toFixed(7) + ',' +
        ORIGIN_LNG.toFixed(7);

    var dest =
        destination.lat.toFixed(7) + ',' +
        destination.lng.toFixed(7);

    coordsDisplay.textContent = dest;

    // نشان ـ فرمت آزمایش‌شده
    var neshanUrl =
        'https://nshn.ir/maps?origin=' +
        origin +
        '&destination=' +
        dest +
        '&type=drive';

    document.getElementById('neshanBtn').href = neshanUrl;

    // بلد ـ لینک جست‌وجوی مسیر با مبدأ و مقصد
    var baladUrl =
        'https://balad.ir/directions?origin=' +
        encodeURIComponent(origin) +
        '&destination=' +
        encodeURIComponent(dest);

    document.getElementById('baladBtn').href = baladUrl;

    // گوگل‌مپ
    var googleUrl =
        'https://www.google.com/maps/dir/?api=1' +
        '&origin=' + encodeURIComponent(origin) +
        '&destination=' + encodeURIComponent(dest) +
        '&travelmode=driving';

    document.getElementById('googleBtn').href = googleUrl;

})();
</script>

</body>
</html>
