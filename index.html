
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسیریابی نشر ماهی</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 22px 15px;
    background: #f2f4f7;
    color: #1e293b;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    max-width: 430px;
    margin: 25px auto;
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 23px;
    color: #183b63;
    margin: 0 0 10px;
}

.header p {
    font-size: 13px;
    color: #64748b;
    line-height: 2;
}

.destination {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    line-height: 2;
}

.destination strong {
    display: block;
    margin-bottom: 5px;
}

.coordinates {
    direction: ltr;
    text-align: center;
    font-size: 12px;
    color: #64748b;
    overflow-wrap: anywhere;
}

button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 16px 12px;
    margin: 7px 0;
    font-size: 15px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

.neshan {
    background: #e8f3eb;
    color: #176b39;
}

.balad {
    background: #fff0e6;
    color: #a64b16;
}

.google {
    background: #e9efff;
    color: #2452a4;
}

.secondary {
    background: #f1f5f9;
    color: #475569;
}

button:active {
    transform: scale(.98);
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.status {
    text-align: center;
    font-size: 12px;
    line-height: 2;
    color: #64748b;
    margin-top: 15px;
}

.footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>مسیریابی مقصد</h1>
        <p>
            برگه آدرس پیک نشر ماهی<br>
            مسیر از دفتر نشر ماهی تا مقصد تحویل
        </p>
    </div>

    <div class="destination">
        <strong>مبدأ حرکت: دفتر نشر ماهی</strong>
        <div class="coordinates" id="originCoordinates"></div>
    </div>

    <div class="destination">
        <strong>مقصد تحویل مرسوله</strong>
        <div class="coordinates" id="destinationCoordinates">
            در حال دریافت اطلاعات مقصد...
        </div>
    </div>

    <button class="neshan" id="neshanButton" onclick="openNeshan()">
        مسیریابی با نشان
    </button>

    <button class="balad" id="baladButton" onclick="openBalad()">
        بازکردن بلد و کپی مختصات
    </button>

    <button class="google" id="googleButton" onclick="openGoogle()">
        مسیریابی با گوگل‌مپ
    </button>

    <button class="secondary" id="copyButton" onclick="copyCoordinates()">
        کپی مختصات مقصد
    </button>

    <div class="status" id="status">
        مبدأ ثابت دفتر است. مقصد از QR دریافت می‌شود.
    </div>

    <div class="footer">
        انتشارات ماهی · دفتر آدرس پیک
    </div>

</div>

<script>

/* مختصات ثابت دفتر نشر ماهی */

var defaultOriginLat = 35.70129294788876;
var defaultOriginLng = 51.398984197047696;


/* دریافت اطلاعات QR */

var params = new URLSearchParams(window.location.search);

var lat = parseFloat(params.get('lat'));
var lng = parseFloat(params.get('lng'));

/* در صورت وجود مختصات مبدأ در QR، همان استفاده می‌شود.
   در غیر این صورت مبدأ ثابت دفتر استفاده می‌شود. */

var originLat = parseFloat(params.get('origin_lat'));
var originLng = parseFloat(params.get('origin_lng'));

if (!Number.isFinite(originLat) || !Number.isFinite(originLng)) {
    originLat = defaultOriginLat;
    originLng = defaultOriginLng;
}

var coordinates = document.getElementById('destinationCoordinates');
var originCoordinates = document.getElementById('originCoordinates');
var statusBox = document.getElementById('status');

var validDestination =
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    lat >= -90 &&
    lat <= 90 &&
    lng >= -180 &&
    lng <= 180 &&
    !(lat === 0 && lng === 0);

var validOrigin =
    Number.isFinite(originLat) &&
    Number.isFinite(originLng) &&
    originLat >= -90 &&
    originLat <= 90 &&
    originLng >= -180 &&
    originLng <= 180;

originCoordinates.textContent = originLat + ' , ' + originLng;

if (validDestination && validOrigin) {

    coordinates.textContent = lat + ' , ' + lng;

} else {

    coordinates.textContent = 'مختصات مقصد معتبر نیست.';

    statusBox.textContent =
        'لطفاً QR صحیح برگه آدرس را اسکن کنید.';

    document.querySelectorAll('button').forEach(function(button) {
        button.disabled = true;
    });

}


/* لینک نمایش نقطه مقصد در نسخه وب نشان */

function getNeshanWebUrl() {

    return 'https://neshan.org/maps/share/' + lat + ',' + lng;

}


/* مسیریابی با اپلیکیشن نشان */

function openNeshan() {

    if (!validDestination || !validOrigin) return;

    var destination = lat + ',' + lng;
    var origin = originLat + ',' + originLng;

    var isAndroid = /Android/i.test(navigator.userAgent);
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    statusBox.textContent =
        'در حال ارسال مبدأ و مقصد به نشان...';

    if (isAndroid) {

        var fallbackUrl = getNeshanWebUrl();

        var intentUrl =
            'intent://nshn.ir/?origin=' +
            encodeURIComponent(origin) +
            '&destination=' +
            encodeURIComponent(destination) +
            '&type=drive' +
            '#Intent;' +
            'scheme=https;' +
            'package=org.rajman.neshan.traffic.tehran.navigator;' +
            'S.browser_fallback_url=' +
            encodeURIComponent(fallbackUrl) +
            ';end';

        window.location.href = intentUrl;

    } else if (isIOS) {

        var iosUrl =
            'neshan://?origin=' +
            encodeURIComponent(origin) +
            '&destination=' +
            encodeURIComponent(destination);

        window.location.href = iosUrl;

    } else {

        window.open(getNeshanWebUrl(), '_blank');

        statusBox.textContent =
            'نقطه مقصد در نسخه وب نشان باز شد.';

    }

}


/* مسیریابی با گوگل مپ */

function openGoogle() {

    if (!validDestination || !validOrigin) return;

    var url =
        'https://www.google.com/maps/dir/?api=1' +
        '&origin=' +
        encodeURIComponent(originLat + ',' + originLng) +
        '&destination=' +
        encodeURIComponent(lat + ',' + lng) +
        '&travelmode=driving';

    window.location.href = url;

}


/* کپی مختصات مقصد */

function copyCoordinates() {

    if (!validDestination) return;

    var value = lat + ',' + lng;

    if (navigator.clipboard && window.isSecureContext) {

        navigator.clipboard.writeText(value)
            .then(function() {
                statusBox.textContent = 'مختصات مقصد کپی شد.';
            })
            .catch(function() {
                fallbackCopy(value);
            });

    } else {

        fallbackCopy(value);

    }

}


function fallbackCopy(value) {

    var input = document.createElement('textarea');

    input.value = value;
    input.style.position = 'fixed';
    input.style.opacity = '0';

    document.body.appendChild(input);
    input.select();

    var success = false;

    try {
        success = document.execCommand('copy');
    } catch (e) {
        success = false;
    }

    document.body.removeChild(input);

    if (success) {
        statusBox.textContent = 'مختصات مقصد کپی شد.';
    } else {
        statusBox.textContent = 'مختصات مقصد: ' + value;
    }

}


/* بازکردن بلد */

function openBalad() {

    if (!validDestination) return;

    var value = lat + ',' + lng;

    function goToBalad() {

        statusBox.textContent =
            'مختصات مقصد کپی شد. آن را در بلد وارد کنید.';

        window.location.href = 'https://balad.ir/';

    }

    if (navigator.clipboard && window.isSecureContext) {

        navigator.clipboard.writeText(value)
            .then(goToBalad)
            .catch(function() {
                fallbackCopy(value);
                goToBalad();
            });

    } else {

        fallbackCopy(value);
        goToBalad();

    }

}

</script>

</body>
</html>
