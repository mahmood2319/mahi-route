
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسیریابی نشر ماهی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 22px 15px;
    background: #f2f4f7;
    color: #1e293b;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: 25px auto;
}

.card {
    background: #ffffff;
    border-radius: 18px;
    padding: 25px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    text-align: center;
}

h1 {
    font-size: 21px;
    margin: 8px 0;
    color: #263548;
}

.subtitle {
    color: #64748b;
    font-size: 13px;
    line-height: 2;
    margin-bottom: 22px;
}

.location {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 12px;
    text-align: right;
}

.location-title {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 7px;
}

.coordinates {
    direction: ltr;
    text-align: left;
    font-size: 12px;
    color: #334155;
    overflow-wrap: anywhere;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 11px;
    margin-top: 22px;
}

button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 15px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
}

.browser {
    background: #263b50;
    color: white;
    border: 2px solid #d6a84b;
    margin-bottom: 12px;
}

.neshan {
    background: #e65335;
    color: white;
}

.balad {
    background: #1677d2;
    color: white;
}

.google {
    background: #18865b;
    color: white;
}

button:active {
    transform: scale(0.98);
}

.status {
    margin-top: 17px;
    font-size: 12px;
    line-height: 2;
    color: #64748b;
    min-height: 25px;
}

.footer {
    margin-top: 22px;
    color: #94a3b8;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>مسیریابی نشر ماهی</h1>

        <div class="subtitle">
            مقصد تحویل مرسوله را انتخاب کنید و مسیر را مشاهده کنید.
        </div>

        <div class="location">
            <div class="location-title">مبدأ حرکت؛ دفتر نشر ماهی</div>
            <div class="coordinates" id="originCoordinates"></div>
        </div>

        <div class="location">
            <div class="location-title">مقصد تحویل مرسوله</div>
            <div class="coordinates" id="destinationCoordinates"></div>
        </div>

        <div class="buttons">

            <button class="browser" onclick="openChrome()">
                باز کردن صفحه در مرورگر اصلی گوشی
            </button>

            <button class="neshan" onclick="openNeshan()">
                مسیریابی با نشان
            </button>

            <button class="balad" onclick="openBalad()">
                مسیریابی با بلد
            </button>

            <button class="google" onclick="openGoogle()">
                مسیریابی با گوگل‌مپ
            </button>

        </div>

        <div class="status" id="status">
            اطلاعات مقصد دریافت شد.
        </div>

        <div class="footer">
            انتشارات ماهی · ناشر کتاب‌های خوب
        </div>

    </div>
</div>

<script>

/* مختصات دفتر نشر ماهی */

var defaultOriginLat = 35.70129294788876;
var defaultOriginLng = 51.398984197047696;

/* دریافت مختصات QR */

var params = new URLSearchParams(window.location.search);

var lat = parseFloat(params.get('lat'));
var lng = parseFloat(params.get('lng'));

var originLat = parseFloat(params.get('origin_lat'));
var originLng = parseFloat(params.get('origin_lng'));

if (!isFinite(originLat) || !isFinite(originLng)) {
    originLat = defaultOriginLat;
    originLng = defaultOriginLng;
}

var validDestination =
    isFinite(lat) &&
    isFinite(lng) &&
    lat >= -90 &&
    lat <= 90 &&
    lng >= -180 &&
    lng <= 180;

var validOrigin =
    isFinite(originLat) &&
    isFinite(originLng) &&
    originLat >= -90 &&
    originLat <= 90 &&
    originLng >= -180 &&
    originLng <= 180;

/* نمایش مختصات */

document.getElementById('originCoordinates').textContent =
    originLat + ', ' + originLng;

if (validDestination) {

    document.getElementById('destinationCoordinates').textContent =
        lat + ', ' + lng;

} else {

    document.getElementById('destinationCoordinates').textContent =
        'مختصات مقصد معتبر نیست';

    document.getElementById('status').textContent =
        'خطا: اطلاعات مقصد در QR وجود ندارد.';

}

/* وضعیت صفحه */

function showStatus(message) {
    document.getElementById('status').textContent = message;
}

/* باز کردن صفحه در Chrome اندروید */

function openChrome() {

    var currentUrl = window.location.href;

    if (!/^https?:\/\//i.test(currentUrl)) {
        showStatus('آدرس صفحه معتبر نیست.');
        return;
    }

    var chromeUrl =
        'intent://' +
        currentUrl.replace(/^https?:\/\//i, '') +
        '#Intent;' +
        'scheme=https;' +
        'package=com.android.chrome;' +
        'S.browser_fallback_url=' +
        encodeURIComponent(currentUrl) +
        ';end';

    showStatus('در حال تلاش برای باز کردن Chrome...');

    window.location.href = chromeUrl;
}

/* مسیریابی با نشان */

function openNeshan() {

    if (!validDestination || !validOrigin) {
        showStatus('مختصات مبدأ یا مقصد معتبر نیست.');
        return;
    }

    var origin = originLat + ',' + originLng;
    var destination = lat + ',' + lng;

    var url =
        'https://nshn.ir/?origin=' +
        encodeURIComponent(origin) +
        '&destination=' +
        encodeURIComponent(destination);

    showStatus('در حال باز کردن نشان...');

    window.location.href = url;
}

/* مسیریابی با بلد */

function openBalad() {

    if (!validDestination) {
        showStatus('مختصات مقصد معتبر نیست.');
        return;
    }

    var url =
        'https://balad.ir/location?latitude=' +
        encodeURIComponent(lat) +
        '&longitude=' +
        encodeURIComponent(lng);

    showStatus('در حال باز کردن مقصد در بلد...');

    window.location.href = url;
}

/* مسیریابی با گوگل‌مپ */

function openGoogle() {

    if (!validDestination || !validOrigin) {
        showStatus('مختصات مبدأ یا مقصد معتبر نیست.');
        return;
    }

    var origin = originLat + ',' + originLng;
    var destination = lat + ',' + lng;

    var url =
        'https://www.google.com/maps/dir/?api=1' +
        '&origin=' + encodeURIComponent(origin) +
        '&destination=' + encodeURIComponent(destination) +
        '&travelmode=driving';

    showStatus('در حال باز کردن گوگل‌مپ...');

    window.location.href = url;
}

</script>

</body>
</html>
