
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسیریابی نشر ماهی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 22px 15px;
    background: #f2f4f7;
    color: #1e293b;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    max-width: 430px;
    margin: 25px auto;
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 23px;
    color: #183b63;
    margin: 0 0 10px;
}

.header p {
    font-size: 13px;
    color: #64748b;
    line-height: 2;
}

.destination {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
}

.destination strong {
    display: block;
    margin-bottom: 8px;
}

.coordinates {
    direction: ltr;
    text-align: center;
    font-size: 13px;
    color: #64748b;
    word-break: break-all;
}

button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 16px 12px;
    margin: 7px 0;
    font-size: 15px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.neshan {
    background: #e8f3eb;
    color: #176b39;
}

.balad {
    background: #fff0e6;
    color: #a64b16;
}

.google {
    background: #e9efff;
    color: #2452a4;
}

.secondary {
    background: #f1f5f9;
    color: #475569;
}

.status {
    text-align: center;
    font-size: 12px;
    line-height: 2;
    color: #64748b;
    margin-top: 15px;
    min-height: 48px;
}

.footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>مسیریابی مقصد</h1>
        <p>
            برگه آدرس پیک نشر ماهی<br>
            مسیریاب موردنظر خود را انتخاب کنید.
        </p>
    </div>

    <div class="destination">
        <strong>مقصد تحویل مرسوله</strong>
        <div class="coordinates" id="coordinates">
            در حال دریافت اطلاعات مقصد...
        </div>
    </div>

    <button class="neshan" id="neshanButton" onclick="openNeshan()">
        مسیریابی با نشان
    </button>

    <button class="balad" id="baladButton" onclick="openBalad()">
        بازکردن بلد و کپی مختصات
    </button>

    <button class="google" id="googleButton" onclick="openGoogle()">
        مسیریابی با گوگل‌مپ
    </button>

    <button class="secondary" id="copyButton" onclick="copyCoordinates()">
        کپی مختصات مقصد
    </button>

    <div class="status" id="status">
        برای مسیریابی، GPS و دسترسی موقعیت مکانی گوشی را فعال کنید.
    </div>

    <div class="footer">
        انتشارات ماهی · دفتر آدرس پیک
    </div>

</div>

<script>
var params = new URLSearchParams(window.location.search);

var lat = parseFloat(params.get('lat'));
var lng = parseFloat(params.get('lng'));

var coordinates = document.getElementById('coordinates');
var statusBox = document.getElementById('status');

var validDestination =
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    lat >= -90 && lat <= 90 &&
    lng >= -180 && lng <= 180 &&
    !(lat === 0 && lng === 0);

if (!validDestination) {

    coordinates.textContent = 'مختصات مقصد معتبر نیست.';
    statusBox.textContent = 'لطفاً QR صحیح برگه آدرس را اسکن کنید.';

    document.querySelectorAll('button').forEach(function(button) {
        button.disabled = true;
    });

} else {

    coordinates.textContent =
        lat.toFixed(6) + ' , ' + lng.toFixed(6);

}

function setStatus(message) {
    statusBox.textContent = message;
}

function getOrigin(callback) {

    if (!navigator.geolocation) {
        setStatus('مرورگر از GPS پشتیبانی نمی‌کند.');
        callback(null, null);
        return;
    }

    setStatus('در حال دریافت موقعیت فعلی گوشی...');

    navigator.geolocation.getCurrentPosition(

        function(position) {

            var originLat = position.coords.latitude;
            var originLng = position.coords.longitude;

            setStatus('موقعیت فعلی گوشی دریافت شد. در حال باز کردن مسیریاب...');

            callback(originLat, originLng);
        },

        function(error) {

            var message = 'موقعیت گوشی دریافت نشد.';

            if (error.code === 1) {
                message = 'دسترسی GPS برای مرورگر مجاز نیست.';
            } else if (error.code === 2) {
                message = 'موقعیت فعلی پیدا نشد. GPS و اینترنت را بررسی کنید.';
            } else if (error.code === 3) {
                message = 'زمان دریافت موقعیت تمام شد.';
            }

            setStatus(message);
            callback(null, null);
        },

        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 30000
        }
    );
}

function openNeshan() {

    if (!validDestination) return;

    getOrigin(function(originLat, originLng) {

        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        var destination = lat + ',' + lng;

        if (originLat !== null && originLng !== null) {

            var origin = originLat + ',' + originLng;

            if (isIOS) {

                var url =
                    'neshan://?origin=' +
                    encodeURIComponent(origin) +
                    '&destination=' +
                    encodeURIComponent(destination);

            } else {

                var url =
                    'https://nshn.ir/?origin=' +
                    encodeURIComponent(origin) +
                    '&destination=' +
                    encodeURIComponent(destination);

            }

            window.location.href = url;

        } else {

            setStatus('مبدأ دریافت نشد؛ مقصد را در نشان باز می‌کنیم.');

            if (isIOS) {

                window.location.href =
                    'neshan://?destination=' +
                    encodeURIComponent(destination);

            } else {

                window.location.href =
                    'https://nshn.ir/?lat=' +
                    encodeURIComponent(lat) +
                    '&lng=' +
                    encodeURIComponent(lng);

            }
        }

    });
}

function openGoogle() {

    if (!validDestination) return;

    getOrigin(function(originLat, originLng) {

        var url =
            'https://www.google.com/maps/dir/?api=1' +
            '&destination=' +
            encodeURIComponent(lat + ',' + lng) +
            '&travelmode=driving';

        if (originLat !== null && originLng !== null) {
            url += '&origin=' +
                encodeURIComponent(originLat + ',' + originLng);
        }

        window.location.href = url;

    });
}

function copyText(value, callback) {

    if (navigator.clipboard && window.isSecureContext) {

        navigator.clipboard.writeText(value).then(

            function() {
                callback(true);
            },

            function() {
                callback(fallbackCopy(value));
            }

        );

    } else {

        callback(fallbackCopy(value));

    }
}

function fallbackCopy(value) {

    var input = document.createElement('textarea');

    input.value = value;
    input.style.position = 'fixed';
    input.style.opacity = '0';

    document.body.appendChild(input);

    input.focus();
    input.select();

    var success = false;

    try {
        success = document.execCommand('copy');
    } catch (e) {
        success = false;
    }

    document.body.removeChild(input);

    return success;
}

function copyCoordinates() {

    if (!validDestination) return;

    var value = lat + ',' + lng;

    copyText(value, function(success) {

        if (success) {
            setStatus('مختصات مقصد با موفقیت کپی شد.');
        } else {
            setStatus('کپی خودکار انجام نشد. مختصات: ' + value);
        }

    });
}

function openBalad() {

    if (!validDestination) return;

    var value = lat + ',' + lng;

    setStatus('در حال کپی مختصات و باز کردن بلد...');

    copyText(value, function(success) {

        if (success) {
            setStatus('مختصات کپی شد. در بلد مقصد را وارد کنید.');
        } else {
            setStatus('بلد باز می‌شود؛ مختصات را از صفحه قبلی بردارید.');
        }

        window.location.href = 'https://balad.ir/';

    });
}
</script>

</body>
</html>
