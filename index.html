
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مسیریابی مرسولات — نشر ماهی</title>

    <style>
        :root {
            --primary: #9e3d24;
            --primary-hover: #832e18;
            --neshan-color: #e04622;
            --balad-color: #0c8a5a;
            --google-color: #1a73e8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05),
                        0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .info-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 13.5px;
            line-height: 1.8;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .value {
            font-weight: 600;
            color: var(--text-main);
        }

        .coord-box {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 12px;
            direction: ltr;
            color: #475569;
            gap: 8px;
        }

        .copy-btn {
            background: #e2e8f0;
            border: none;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }

        .copy-btn:active {
            background: #cbd5e1;
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14.5px;
            font-weight: 600;
            transition: transform 0.15s ease, opacity 0.2s ease;
            user-select: none;
        }

        .nav-btn:active {
            transform: scale(0.98);
            filter: brightness(0.92);
        }

        .btn-neshan {
            background-color: var(--neshan-color);
        }

        .btn-balad {
            background-color: var(--balad-color);
        }

        .btn-google {
            background-color: var(--google-color);
        }

        .error-card {
            display: none;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .error-card code {
            display: block;
            margin-top: 8px;
            font-size: 11px;
            direction: ltr;
            color: #b91c1c;
            word-break: break-all;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 11.5px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<main class="card">

    <header class="header">
        <h1 class="logo">انتشارات ماهی</h1>
        <p class="subtitle">هدایت به مسیریاب جهت تحویل مرسوله</p>
    </header>

    <div id="errorState" class="error-card">
        <strong>مختصات مقصد یافت نشد یا نامعتبر است!</strong>
        <span>لطفاً از صحت کیوآرکد یا لینک اطمینان حاصل فرمایید.</span>
        <code id="debugUrl"></code>
    </div>

    <section class="info-box" id="infoBox">

        <div class="info-row">
            <span class="label">مبدأ حرکت:</span>
            <span class="value">دفتر مرکزی نشر ماهی</span>
        </div>

        <div class="info-row">
            <span class="label">مقصد تحویل:</span>
            <span class="value">آدرس گیرنده</span>
        </div>

        <div class="coord-box">
            <span id="coordsDisplay">در حال خواندن مختصات...</span>
            <button type="button" class="copy-btn" id="copyBtn">کپی</button>
        </div>

    </section>

    <nav class="actions-group" id="actionLinks">

        <a id="neshanBtn" class="nav-btn btn-neshan"
           
            مسیریابی با نشان
        </a>

        <a id="baladBtn" class="nav-btn btn-balad"
           target="_blank" rel="noopener noreferrer">
            مسیریابی با بلد
        </a>

        <a id="googleBtn" class="nav-btn btn-google"
           target="_blank" rel="noopener noreferrer">
            مسیریابی با گوگل مپ
        </a>

    </nav>

    <footer class="footer">
        انتشارات ماهی · ناشر کتاب‌های خوب
    </footer>

</main>

<script>
(function () {

    // مختصات دقیق و ثابت دفتر مرکزی نشر ماهی
    var ORIGIN_LAT = 35.70129294788876;
    var ORIGIN_LNG = 51.398984197047696;

    // تبدیل اعداد فارسی و عربی به انگلیسی
    function normalizeDigits(value) {

        return String(value || '')
            .replace(/[۰-۹]/g, function (digit) {
                return '۰۱۲۳۴۵۶۷۸۹'.indexOf(digit);
            })
            .replace(/[٠-٩]/g, function (digit) {
                return '٠١٢٣٤٥٦٧٨٩'.indexOf(digit);
            })
            .trim();
    }

    // بررسی معتبر بودن مختصات
    function isValidCoordinate(lat, lng) {

        return isFinite(lat) &&
               isFinite(lng) &&
               lat >= -90 &&
               lat <= 90 &&
               lng >= -180 &&
               lng <= 180 &&
               !(lat === 0 && lng === 0);
    }

    // خواندن مقصد از آدرس صفحه
    function extractDestination() {

        var params = new URLSearchParams(window.location.search);

        var rawLat =
            params.get('lat') ||
            params.get('latitude') ||
            params.get('dest_lat') ||
            params.get('destination_lat');

        var rawLng =
            params.get('lng') ||
            params.get('lon') ||
            params.get('longitude') ||
            params.get('dest_lng') ||
            params.get('destination_lng');

        if (!rawLat || !rawLng) {
            return null;
        }

        var lat = Number(
            normalizeDigits(rawLat).replace(/,/g, '.')
        );

        var lng = Number(
            normalizeDigits(rawLng).replace(/,/g, '.')
        );

        if (!isValidCoordinate(lat, lng)) {
            return null;
        }

        return {
            lat: lat,
            lng: lng
        };
    }

    // استخراج مختصات مقصد
    var destination = extractDestination();

    var errorState = document.getElementById('errorState');
    var actionLinks = document.getElementById('actionLinks');
    var coordsDisplay = document.getElementById('coordsDisplay');
    var copyBtn = document.getElementById('copyBtn');

    // اگر مقصد پیدا نشد
    if (!destination) {

        errorState.style.display = 'block';
        actionLinks.style.display = 'none';
        coordsDisplay.textContent = 'مختصات نامعتبر است';
        copyBtn.style.display = 'none';

        document.getElementById('debugUrl').textContent =
            window.location.href;

        return;
    }

    // نمایش مختصات مقصد
    coordsDisplay.textContent =
        destination.lat.toFixed(7) + ', ' +
        destination.lng.toFixed(7);

    // ساخت رشته مبدأ و مقصد
    var origin =
        ORIGIN_LAT + ',' + ORIGIN_LNG;

    var dest =
        destination.lat + ',' + destination.lng;

    // ساخت لینک نشان با قالب آزمایش‌شده
    var neshanUrl =
        'https://nshn.ir/?origin=' +
        origin +
        '&destination=' +
        dest;

    document.getElementById('neshanBtn').href = neshanUrl;

    // ساخت لینک بلد
    var baladUrl =
        'https://balad.ir/directions?origin=' +
        origin +
        '&destination=' +
        dest;

    document.getElementById('baladBtn').href = baladUrl;

    // ساخت لینک گوگل مپ
    var googleUrl =
        'https://www.google.com/maps/dir/?api=1&origin=' +
        origin +
        '&destination=' +
        dest +
        '&travelmode=driving';

    document.getElementById('googleBtn').href = googleUrl;

    // کپی مختصات مقصد
    copyBtn.addEventListener('click', function () {

        var text = destination.lat + ',' + destination.lng;

        if (navigator.clipboard &&
            navigator.clipboard.writeText) {

            navigator.clipboard.writeText(text).then(function () {

                copyBtn.textContent = 'کپی شد!';

                setTimeout(function () {
                    copyBtn.textContent = 'کپی';
                }, 1800);

            }).catch(function () {
                alert('کپی خودکار انجام نشد. مختصات: ' + text);
            });

        } else {

            alert('مختصات مقصد: ' + text);
        }
    });

})();
</script>

</body>
</html>
