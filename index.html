
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسیریابی نشر ماهی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 22px 15px;
    background: #f2f4f7;
    color: #1e293b;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    max-width: 430px;
    margin: 25px auto;
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 23px;
    color: #183b63;
    margin: 0 0 10px;
}

.header p {
    font-size: 13px;
    color: #64748b;
    line-height: 2;
}

.destination {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
}

.destination strong {
    display: block;
    margin-bottom: 8px;
}

.coordinates {
    direction: ltr;
    text-align: center;
    font-size: 13px;
    color: #64748b;
}

button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 16px 12px;
    margin: 7px 0;
    font-size: 15px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

.neshan {
    background: #e8f3eb;
    color: #176b39;
}

.balad {
    background: #fff0e6;
    color: #a64b16;
}

.google {
    background: #e9efff;
    color: #2452a4;
}

.secondary {
    background: #f1f5f9;
    color: #475569;
}

button:active {
    transform: scale(.98);
}

.status {
    text-align: center;
    font-size: 12px;
    line-height: 2;
    color: #64748b;
    margin-top: 15px;
}

.footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>مسیریابی مقصد</h1>
        <p>
            برگه آدرس پیک نشر ماهی<br>
            مسیریاب موردنظر خود را انتخاب کنید.
        </p>
    </div>

    <div class="destination">
        <strong>مقصد تحویل مرسوله</strong>
        <div class="coordinates" id="coordinates">
            در حال دریافت اطلاعات مقصد...
        </div>
    </div>

    <button class="neshan" onclick="openNeshan()">
        مسیریابی با نشان
    </button>

    <button class="balad" onclick="openBalad()">
        بازکردن بلد و کپی مختصات
    </button>

    <button class="google" onclick="openGoogle()">
        مسیریابی با گوگل‌مپ
    </button>

    <button class="secondary" onclick="copyCoordinates()">
        کپی مختصات مقصد
    </button>

    <div class="status" id="status">
        برای مسیریابی، دسترسی موقعیت مکانی گوشی را فعال کنید.
    </div>

    <div class="footer">
        انتشارات ماهی · دفتر آدرس پیک
    </div>

</div>

<script>
var params = new URLSearchParams(window.location.search);

var lat = parseFloat(params.get('lat'));
var lng = parseFloat(params.get('lng'));

var originLat = null;
var originLng = null;

var coordinates = document.getElementById('coordinates');
var statusBox = document.getElementById('status');

if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lng) ||
    lat < -90 || lat > 90 ||
    lng < -180 || lng > 180 ||
    (lat === 0 && lng === 0)
) {
    coordinates.textContent = 'مختصات مقصد معتبر نیست.';
    statusBox.textContent = 'لطفاً QR صحیح را اسکن کنید.';
    document.querySelectorAll('button').forEach(function(button) {
        button.disabled = true;
        button.style.opacity = '.4';
    });
} else {
    coordinates.textContent = lat + ' , ' + lng;
}

function getOrigin(callback) {
    if (!navigator.geolocation) {
        statusBox.textContent = 'این مرورگر از GPS پشتیبانی نمی‌کند.';
        callback(null, null);
        return;
    }

    statusBox.textContent = 'در حال دریافت موقعیت فعلی گوشی...';

    navigator.geolocation.getCurrentPosition(
        function(position) {
            originLat = position.coords.latitude;
            originLng = position.coords.longitude;

            statusBox.textContent = 'موقعیت فعلی گوشی دریافت شد.';
            callback(originLat, originLng);
        },
        function() {
            statusBox.textContent =
                'موقعیت دریافت نشد؛ مسیریاب را باز کنید و GPS را فعال کنید.';
            callback(null, null);
        },
        {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 0
        }
    );
}

function openNeshan() {
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

    getOrigin(function(oLat, oLng) {
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (oLat !== null && oLng !== null) {
            if (isIOS) {
                var url = 'neshan://?origin=' +
                    oLat + ',' + oLng +
                    '&destination=' + lat + ',' + lng;

                window.location.href = url;
            } else {
                var url = 'https://nshn.ir/?origin=' +
                    oLat + ',' + oLng +
                    '&destination=' + lat + ',' + lng;

                window.location.href = url;
            }
        } else {
            if (isIOS) {
                window.location.href =
                    'neshan://?destination=' + lat + ',' + lng;
            } else {
                window.location.href =
                    'https://nshn.ir?lat=' + lat + '&lng=' + lng;
            }
        }
    });
}

function openGoogle() {
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

    var url = 'https://www.google.com/maps/dir/?api=1' +
        '&destination=' + encodeURIComponent(lat + ',' + lng) +
        '&travelmode=driving';

    window.location.href = url;
}

function openBalad() {
    copyCoordinates();

    statusBox.textContent =
        'مختصات کپی شد. در بلد مقصد را جست‌وجو یا وارد کنید.';

    window.location.href = 'https://balad.ir/';
}

function copyCoordinates() {
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

    var value = lat + ',' + lng;

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(value).then(function() {
            statusBox.textContent = 'مختصات مقصد کپی شد.';
        }).catch(function() {
            statusBox.textContent = 'مختصات: ' + value;
        });
    } else {
        statusBox.textContent = 'مختصات مقصد: ' + value;
    }
}
</script>

</body>
</html>
