
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسیریابی نشر ماهی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 22px 15px;
    background: #f2f4f7;
    color: #1e293b;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    max-width: 430px;
    margin: 25px auto;
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 23px;
    color: #183b63;
    margin: 0 0 10px;
}

.header p {
    font-size: 13px;
    color: #64748b;
    line-height: 2;
}

.destination {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
}

.destination strong {
    display: block;
    margin-bottom: 8px;
}

.coordinates {
    direction: ltr;
    text-align: center;
    font-size: 13px;
    color: #64748b;
    overflow-wrap: anywhere;
}

button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 16px 12px;
    margin: 7px 0;
    font-size: 15px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

.neshan {
    background: #e8f3eb;
    color: #176b39;
}

.balad {
    background: #fff0e6;
    color: #a64b16;
}

.google {
    background: #e9efff;
    color: #2452a4;
}

.secondary {
    background: #f1f5f9;
    color: #475569;
}

button:active {
    transform: scale(.98);
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.status {
    text-align: center;
    font-size: 12px;
    line-height: 2;
    color: #64748b;
    margin-top: 15px;
}

.footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>مسیریابی مقصد</h1>
        <p>
            برگه آدرس پیک نشر ماهی<br>
            مسیریاب موردنظر خود را انتخاب کنید.
        </p>
    </div>

    <div class="destination">
        <strong>مقصد تحویل مرسوله</strong>
        <div class="coordinates" id="coordinates">
            در حال دریافت اطلاعات مقصد...
        </div>
    </div>

    <button class="neshan" id="neshanButton" onclick="openNeshan()">
        مسیریابی با نشان
    </button>

    <button class="balad" id="baladButton" onclick="openBalad()">
        بازکردن بلد و کپی مختصات
    </button>

    <button class="google" id="googleButton" onclick="openGoogle()">
        مسیریابی با گوگل‌مپ
    </button>

    <button class="secondary" id="copyButton" onclick="copyCoordinates()">
        کپی مختصات مقصد
    </button>

    <div class="status" id="status">
        موقعیت فعلی باید از GPS خود برنامه مسیریاب دریافت شود.
    </div>

    <div class="footer">
        انتشارات ماهی · دفتر آدرس پیک
    </div>

</div>

<script>
var params = new URLSearchParams(window.location.search);

var lat = parseFloat(params.get('lat'));
var lng = parseFloat(params.get('lng'));

var coordinates = document.getElementById('coordinates');
var statusBox = document.getElementById('status');

var buttons = document.querySelectorAll('button');

var validDestination =
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    lat >= -90 &&
    lat <= 90 &&
    lng >= -180 &&
    lng <= 180 &&
    !(lat === 0 && lng === 0);

if (!validDestination) {

    coordinates.textContent = 'مختصات مقصد معتبر نیست.';

    statusBox.textContent = 'لطفاً QR صحیح برگه آدرس را اسکن کنید.';

    buttons.forEach(function(button) {
        button.disabled = true;
    });

} else {

    coordinates.textContent = lat + ' , ' + lng;

}

function openNeshan() {

    if (!validDestination) return;

    statusBox.textContent =
        'در حال بازکردن نشان و ارسال مقصد...';

    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    var destination = lat + ',' + lng;

    var url;

    if (isIOS) {

        url = 'neshan://?destination=' +
            encodeURIComponent(destination);

    } else {

        url = 'https://nshn.ir/?destination=' +
            encodeURIComponent(destination);

    }

    /*
       فقط مقصد ارسال می‌شود.
       مبدأ را باید خود نشان از GPS گوشی بگیرد.
    */

    window.location.href = url;

}

function openGoogle() {

    if (!validDestination) return;

    var url =
        'https://www.google.com/maps/dir/?api=1' +
        '&destination=' +
        encodeURIComponent(lat + ',' + lng) +
        '&travelmode=driving';

    window.location.href = url;

}

function openBalad() {

    if (!validDestination) return;

    var value = lat + ',' + lng;

    copyText(value, function(success) {

        if (success) {

            statusBox.textContent =
                'مختصات کپی شد. در بلد می‌توانید مقصد را وارد کنید.';

        } else {

            statusBox.textContent =
                'مختصات مقصد: ' + value;

        }

        window.location.href = 'https://balad.ir/';

    });

}

function copyCoordinates() {

    if (!validDestination) return;

    var value = lat + ',' + lng;

    copyText(value, function(success) {

        if (success) {

            statusBox.textContent =
                'مختصات مقصد با موفقیت کپی شد.';

        } else {

            statusBox.textContent =
                'کپی خودکار ممکن نیست. مختصات: ' + value;

        }

    });

}

function copyText(value, callback) {

    if (navigator.clipboard && window.isSecureContext) {

        navigator.clipboard.writeText(value)
            .then(function() {
                callback(true);
            })
            .catch(function() {
                fallbackCopy(value, callback);
            });

    } else {

        fallbackCopy(value, callback);

    }

}

function fallbackCopy(value, callback) {

    var input = document.createElement('textarea');

    input.value = value;
    input.style.position = 'fixed';
    input.style.opacity = '0';

    document.body.appendChild(input);

    input.select();

    var success = false;

    try {
        success = document.execCommand('copy');
    } catch (e) {
        success = false;
    }

    document.body.removeChild(input);

    callback(success);

}
</script>

</body>
</html>
