
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>مسیریابی نشر ماهی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 22px 15px;
    background: #f2f4f7;
    color: #1e293b;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: 20px auto;
    background: #ffffff;
    border-radius: 18px;
    padding: 25px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    color: #a34c32;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin-bottom: 25px;
}

.info {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 18px;
    line-height: 2;
    font-size: 13px;
}

.info strong {
    color: #334155;
}

.coordinates {
    direction: ltr;
    text-align: left;
    color: #64748b;
    font-size: 12px;
    word-break: break-all;
    margin-top: 8px;
}

.action {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 15px 12px;
    margin-top: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
}

.neshan {
    background: #b94732;
    color: white;
}

.balad {
    background: #16865b;
    color: white;
}

.google {
    background: #2563eb;
    color: white;
}

.action:active {
    opacity: 0.85;
}

.action.disabled {
    opacity: 0.45;
    pointer-events: none;
}

.footer {
    text-align: center;
    color: #94a3b8;
    font-size: 11px;
    margin-top: 25px;
}

.error {
    display: none;
    color: #b91c1c;
    background: #fef2f2;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    line-height: 2;
    margin-bottom: 15px;
}

.debug {
    direction: ltr;
    text-align: left;
    overflow-wrap: anywhere;
    font-size: 11px;
    color: #64748b;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">انتشارات ماهی</div>

    <div class="subtitle">
        سامانه مسیریابی مرسولات
    </div>

    <div class="info">

        <div>
            <strong>مبدأ:</strong>
            دفتر انتشارات ماهی
        </div>

        <div>
            <strong>مقصد:</strong>
            آدرس مشتری
        </div>

        <div class="coordinates" id="destinationCoordinates">
            در حال دریافت مختصات...
        </div>

    </div>

    <div class="error" id="errorBox">
        مختصات مقصد در لینک QR پیدا نشد.
        <div class="debug" id="debugInfo"></div>
    </div>

    <!-- لینک واقعی نشان، نه پنجره جاوااسکریپتی -->
    <a
        class="action neshan disabled"
        id="neshanButton"
        href="#"
    >
        مسیریابی با نشان
    </a>

    <a
        class="action balad disabled"
        id="baladButton"
        href="#"
    >
        نمایش مقصد در بلد
    </a>

    <a
        class="action google disabled"
        id="googleButton"
        href="#"
    >
        مسیریابی با گوگل‌مپ
    </a>

    <div class="footer">
        انتشارات ماهی · ناشر کتاب‌های خوب
    </div>

</div>

<script>

/* مختصات ثابت دفتر نشر ماهی */

var ORIGIN_LAT = 35.70129294788876;
var ORIGIN_LNG = 51.398984197047696;


/* تبدیل اعداد فارسی و عربی به انگلیسی */

function normalizeDigits(value) {

    var persian = '۰۱۲۳۴۵۶۷۸۹';
    var arabic = '٠١٢٣٤٥٦٧٨٩';

    return String(value).replace(/[۰-۹٠-٩]/g, function(ch) {

        var index = persian.indexOf(ch);

        if (index !== -1) {
            return String(index);
        }

        index = arabic.indexOf(ch);

        if (index !== -1) {
            return String(index);
        }

        return ch;
    });
}


/* خواندن پارامترهای آدرس */

function getPageParams() {

    var params = new URLSearchParams(
        window.location.search
    );

    return params;
}


/* دریافت پارامتر با چند نام احتمالی */

function getFirstParam(params, names) {

    var i;
    var value;

    for (i = 0; i < names.length; i++) {

        value = params.get(names[i]);

        if (value !== null && value !== '') {
            return value;
        }
    }

    return null;
}


/* تبدیل مختصات به عدد */

function parseCoordinate(value) {

    if (value === null || value === '') {
        return NaN;
    }

    value = normalizeDigits(value);
    value = value.trim();
    value = value.replace(/,/g, '.');

    return Number(value);
}


/* بررسی اعتبار مختصات */

function validCoordinates(latitude, longitude) {

    return isFinite(latitude) &&
           isFinite(longitude) &&
           latitude >= -90 &&
           latitude <= 90 &&
           longitude >= -180 &&
           longitude <= 180;
}


/* خواندن مقصد از QR */

var params = getPageParams();

var latValue = getFirstParam(params, [
    'lat',
    'latitude',
    'dest_lat',
    'destination_lat'
]);

var lngValue = getFirstParam(params, [
    'lng',
    'lon',
    'longitude',
    'dest_lng',
    'destination_lng'
]);

var lat = parseCoordinate(latValue);
var lng = parseCoordinate(lngValue);

var destinationIsValid = validCoordinates(lat, lng);


/* ساخت لینک دقیق نشان */

function openNeshan(targetLat, targetLng) {

    targetLat = Number(targetLat);
    targetLng = Number(targetLng);

    if (!validCoordinates(targetLat, targetLng)) {
        return null;
    }

    var url =
        'https://nshn.ir/?origin=' +
        ORIGIN_LAT + ',' + ORIGIN_LNG +
        '&destination=' +
        targetLat.toFixed(8) + ',' +
        targetLng.toFixed(8);

    return url;
}


/* نمایش مختصات و آماده‌سازی لینک‌ها */

if (destinationIsValid) {

    document.getElementById('destinationCoordinates').textContent =
        lat.toFixed(8) + ' , ' + lng.toFixed(8);

    /* نشان */

    document.getElementById('neshanButton').href =
        openNeshan(lat, lng);

    document.getElementById('neshanButton').className =
        'action neshan';


    /* بلد */

    document.getElementById('baladButton').href =
        'https://balad.ir/location?latitude=' +
        lat +
        '&longitude=' +
        lng;

    document.getElementById('baladButton').className =
        'action balad';


    /* گوگل‌مپ */

    document.getElementById('googleButton').href =
        'https://www.google.com/maps/dir/?api=1' +
        '&origin=' + ORIGIN_LAT + ',' + ORIGIN_LNG +
        '&destination=' + lat + ',' + lng +
        '&travelmode=driving';

    document.getElementById('googleButton').className =
        'action google';

} else {

    document.getElementById('errorBox').style.display =
        'block';

    document.getElementById('destinationCoordinates').textContent =
        'مختصات مقصد نامعتبر است';

    document.getElementById('debugInfo').textContent =
        'URL: ' + window.location.href;

}

</script>

</body>
</html>
